# failover_to is applied to non-stream chat requests. Streaming requests keep one
# upstream stream and fail closed instead of switching mid-SSE response.
models:
  gemini-3.8-flash:
    provider: gemini_web
    capabilities: [chat, streaming, vision, reasoning]
    failover_to: [gemini-4-hydrogen]
    timeout_sec: 30
  # Upstream Gemini web tier names (picker labels), same hex as gemini-3.8-flash.
  gemini-4-hydrogen:
    provider: gemini_web
    capabilities: [chat, streaming, vision, reasoning]
    failover_to: [gemini-3.5-flash-lite]
    timeout_sec: 30
  # Chế độ tạo ảnh kiểu toggle của Gemini web: gọi model này là mọi lượt đều
  # render ảnh, và giữ X-Session-ID để nối tiếp cùng hội thoại/phong cách.
  # Same upstream model id as gemini-3.8-flash (verified 2026-11-13); kept as an
  # alias for existing clients.
  gemini-3.6-flash:
    provider: gemini_web
    capabilities: [chat, streaming, vision, reasoning]
    failover_to: [gemini-4-hydrogen]
    timeout_sec: 30
  gemini-4-argon:
    provider: gemini_web
    capabilities: [chat, streaming, reasoning, vision]
    # Upstream mode 8 stalls on most prompts; fail fast instead of holding a lease 15 min.
    failover_to: [gemini-4-hydrogen]
    timeout_sec: 30
  gemini-3.1-pro:
    provider: gemini_web
    capabilities: [chat, streaming, reasoning, vision]
    failover_to: [gemini-4-hydrogen]
    timeout_sec: 30
  # Deepest tier the signed-in picker still lists (upsell-gated in the UI).
  gemini-4-carbon:
    provider: gemini_web
    capabilities: [chat, streaming, reasoning, vision]
    failover_to: [gemini-4-hydrogen]
    timeout_sec: 30
  gemini-3.5-flash-lite:
    provider: gemini_web
    capabilities: [chat, streaming, vision]
    # Best accuracy/latency tier; occasional upstream stalls need headroom.
    guest: true
    failover_to: [gemini-4-hydrogen]
    timeout_sec: 30
  gpt-5.6:
    provider: copilot_ws
    capabilities: [chat, streaming, vision]
    timeout_sec: 90
  gpt-5.6-reasoner:
    provider: copilot_ws
    capabilities: [chat, streaming, reasoning, vision]
    timeout_sec: 180
  copilot-chat:
    provider: copilot_ws
    capabilities: [chat, streaming, vision]
    timeout_sec: 90
  copilot-creative:
