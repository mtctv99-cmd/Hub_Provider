# failover_to is applied to non-stream chat requests. Streaming requests keep one
# upstream stream and fail closed instead of switching mid-SSE response.
models:
  gemini-3.8-flash:
    provider: gemini_web
    capabilities: [chat, streaming, vision, image_generation]
    failover_to: [gemini-3.1-pro]
    timeout_sec: 90
  deepseek-chat:
    provider: deepseek_web
    capabilities: [chat, streaming]
    timeout_sec: 120
  deepseek-flash:
    provider: deepseek_web
    capabilities: [chat, streaming]
    timeout_sec: 120
  deepseek-v4.1-flash:
    provider: deepseek_web
    capabilities: [chat, streaming]
    timeout_sec: 120
  deepseek-v4-flash:
    provider: deepseek_web
    capabilities: [chat, streaming]
    timeout_sec: 120
  deepseek-v4-pro:
    provider: deepseek_web
    capabilities: [chat, streaming, reasoning]
    timeout_sec: 180
  deepseek-reasoner:
    provider: deepseek_web
    capabilities: [chat, streaming, reasoning]
    timeout_sec: 180
  gemini-3.1-pro:
    provider: gemini_web
    capabilities: [chat, streaming, reasoning, vision]
    timeout_sec: 180
  gemini-3.5-flash-lite:
    provider: gemini_web
    capabilities: [chat, streaming]
    timeout_sec: 60
    guest: true
  gpt-5.6:
    provider: copilot_ws
