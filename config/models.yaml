# failover_to is applied to non-stream chat requests. Streaming requests keep one
# upstream stream and fail closed instead of switching mid-SSE response.
models:
  gemini-3.8-flash:
    provider: gemini_web
    capabilities: [chat, streaming, vision, reasoning, image_generation]
    failover_to: [gemini-3.1-pro]
    timeout_sec: 180
  # Chế độ tạo ảnh kiểu toggle của Gemini web: gọi model này là mọi lượt đều
  # render ảnh, và giữ X-Session-ID để nối tiếp cùng hội thoại/phong cách.
  gemini-image:
    provider: gemini_web
    base_model: gemini-3.8-flash
    capabilities: [chat, streaming, image_generation]
    timeout_sec: 180
    image_mode: true
  gemini-3.6-flash:
    provider: gemini_web
    capabilities: [chat, streaming, vision, reasoning, image_generation]
    failover_to: [gemini-3.1-pro]
    timeout_sec: 120
  gemini-4-argon:
