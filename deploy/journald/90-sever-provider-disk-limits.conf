# Journald disk limits (M7).
#
# The production host had only an empty [Journal] section, user journals used
# 2.7 GB, and the system journal total was 4.0 GB. User journals are stored in
# the system journal directory, so this belongs in the SYSTEM journald config:
#
#   sudo install -m 0644 deploy/journald/90-sever-provider-disk-limits.conf \
#        /etc/systemd/journald.conf.d/90-sever-provider-disk-limits.conf
#   sudo systemctl restart systemd-journald
#
# 4 GiB is a cap, not a target: it bounds growth above the current 4.0 GB usage
# without immediately vacuuming history. Runtime journals live in /run (tmpfs)
# and are capped separately so a RAM-backed /run cannot fill memory.
#
# Note: journald's SystemMaxUse applies to all units, including sever-v2. Each
# application owner should be told before this is installed.

[Journal]
SystemMaxUse=4G
SystemMaxFileSize=256M
RuntimeMaxUse=512M
MaxRetentionSec=30day
Compress=yes
