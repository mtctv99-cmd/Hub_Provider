# Log rotation for other applications on the same host (M7 evidence: 28 files
# >10 MB, 3.2 GB total). These directories are NOT owned by this repository.
# Review paths/owners with each application owner before installing:
#   sudo logrotate --debug /etc/logrotate.d/other-app-logs
#
# copytruncate is required for these legacy writers (they do not reopen logs).
# Each app keeps 7 copies because their logs are much larger than this repo's.

/media/reup/Data_sv4/TTS_Omivoices/data/*.log
{
    daily
    rotate 7
    maxsize 200M
    dateext
    dateformat -%Y%m%d-%s
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su reup reup
    create 0640 reup reup
}

